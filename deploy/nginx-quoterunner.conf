# nginx site for QuoteRunner. certbot adds the HTTPS (443) part to this file.
# Install:  sudo cp deploy/nginx-quoterunner.conf /etc/nginx/sites-available/quoterunner
#           sudo ln -s /etc/nginx/sites-available/quoterunner /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# (If your nginx uses /etc/nginx/conf.d/ instead, copy it there as quoterunner.conf.)

server {
    listen 80;
    listen [::]:80;
    server_name quoterunner.ramiyer.tech;

    # Chat messages are at most 1,000 characters; nothing needs a big body.
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One chat turn is up to two LLM calls (60 s timeout each in llm.py).
        proxy_read_timeout 120s;
    }
}
