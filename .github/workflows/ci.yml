# Runs on every pull request and every push to main.
#   tests:      the full pytest suite (the LLM is faked, so no API key is needed)
#   eval-check: replays the latest eval's applications through the 3 carrier portals
#               and fails if any invented value would reach a carrier, any value or
#               decision is wrong, or the results drift from the committed report.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  eval-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m evals.check
