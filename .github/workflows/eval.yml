# Runs on every pull request and every push to main: replays the latest eval's
# applications through the 3 carrier portals (no API key, about 1 s) and fails
# if any invented value would reach a carrier, any value or decision is wrong,
# or the results drift from the committed quotes report.
name: Eval check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eval-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m evals.check
